# Gemma 4 31B-it: int8 trunk (one scale per 128 weights, no calibration) and int8 lm_head, Google's
# assistant head merged in as the MTP drafter (depth 3), and the vision tower. The vision tower stays
# in host memory, so its VRAM goes to the KV cache. Sampling defaults are the checkpoint's
# generation_config; thinking is switched per request (chat_template_kwargs).
# For the full 262,144-token context use --max-model-len 262144 --max-num-seqs 2.
name: radiance-gemma4-31b-i8g
services:
  radiance:
    extends: { file: common.yaml, service: radiance }
    container_name: radiance-gemma4-31b-i8g
    command: >
      --model /models/gemma4-31b-i8g.rad
      --host :: --port ${PORT:-8000} --api-key-env RADIANCE_API_KEY
      --tp 2 --max-num-seqs 8 --max-model-len 65536 --kv-cache-dtype fp8
      --num-speculative-tokens 3 --max-num-batched-tokens 2048 --vision-tower-placement ram
      --temp 1.0 --top-p 0.95 --top-k 64
