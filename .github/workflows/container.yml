name: container-image

# Container image build for a release tag (Containerfile; docs/CONTAINER.md).
#
# Builds the `runtime` (slim, default) or `full` (adds hipcc for JIT of
# unregistered routes) target with the release kernel packs baked in for
# gfx1100, gfx1151 and gfx1201, then runs two GPU-free smoke checks: the
# CLI answers --version, and the baked arch directories exist.
#
# STATUS: DISABLED FOR PUBLISHING. The only trigger is a manual
# workflow_dispatch, and the push steps below are guarded off, so nothing is
# ever sent to ghcr.io/warpfront/hipfire as written. It is a draft pending
# Kaden's approval to publish images.
#
# GPU validation stays manual: a hosted runner has no AMD GPU, so serving,
# model loading and the compose stack are checked by hand on real hardware
# (docs/CONTAINER.md).
#
# To enable publishing, all three are required:
#   1. Add the release-tag trigger (kept here as a comment until approved):
#        # push:
#        #   tags: ['v*']
#      and fall back to github.ref_name where this file reads inputs.tag.
#   2. Grant `packages: write` on the `image` job (see the comment there).
#   3. Flip the `if: ${{ false }}` guards on the login and push steps.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (for example v0.4.3)
        required: true
        type: string
      target:
        description: Image variant to build
        required: false
        type: choice
        options:
          - runtime
          - full
        default: runtime

permissions:
  contents: read

concurrency:
  group: container-image-${{ inputs.tag }}-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # permissions:
    #   contents: read
    #   packages: write   # only once publishing is approved and enabled
    env:
      TAG: ${{ inputs.tag }}
      TARGET: ${{ inputs.target }}
      IMAGE: ghcr.io/warpfront/hipfire
      GPU_ARCHES: gfx1100 gfx1151 gfx1201
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}

      # The ROCm layers unpack to tens of GB, more than a hosted runner's root
      # volume has free, so Docker stores images on the /mnt scratch disk.
      - name: Move Docker storage to the scratch disk
        run: |
          df -h / /mnt
          conf=/etc/docker/daemon.json
          sudo systemctl stop docker.socket docker.service
          sudo mkdir -p /mnt/docker
          { sudo cat "$conf" 2>/dev/null || echo '{}'; } \
            | jq '. + {"data-root": "/mnt/docker"}' | sudo tee "$conf.new" >/dev/null
          sudo mv "$conf.new" "$conf"
          sudo systemctl start docker.service
          df -h / /mnt

      - name: Compute version, revision and tags
        run: |
          version="${TAG#v}"
          revision="$(git rev-parse HEAD)"
          if [ "$TARGET" = full ]; then
            suffix="-full"; moving="full"
          else
            suffix=""; moving="latest"
          fi
          {
            echo "VERSION=$version"
            echo "REVISION=$revision"
            echo "VERSION_TAG=$IMAGE:$version$suffix"
            echo "MOVING_TAG=$IMAGE:$moving"
          } >> "$GITHUB_ENV"

      - name: Build image
        run: |
          docker buildx build \
            -f Containerfile \
            --target "$TARGET" \
            --build-arg HIPFIRE_VERSION="$VERSION" \
            --build-arg HIPFIRE_REVISION="$REVISION" \
            --build-arg HIPFIRE_GPU_ARCHES="$GPU_ARCHES" \
            -t "$VERSION_TAG" \
            -t "$MOVING_TAG" \
            --load \
            .
          docker image ls "$IMAGE"

      # No GPU on the runner: only the CLI and the baked kernel packs can be
      # checked here.
      - name: Smoke test (no GPU)
        run: |
          docker run --rm --entrypoint hipfire "$VERSION_TAG" --version
          docker run --rm --entrypoint sh "$VERSION_TAG" \
            -c 'ls /opt/hipfire/bin/kernels/compiled'

      # Publishing is disabled until Kaden approves it. Enabling needs the
      # tag trigger, `packages: write` on this job, and these guards flipped.
      # The repository's Actions allowlist admits only GitHub-owned and a few
      # named third-party actions, so login and build use the runner's docker
      # CLI (buildx ships with it) instead of docker/* actions.
      - name: Log in to ghcr.io
        if: ${{ false }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push image tags
        if: ${{ false }}
        run: |
          docker push "$VERSION_TAG"
          docker push "$MOVING_TAG"
