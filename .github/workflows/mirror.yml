# SPDX-License-Identifier: Apache-2.0
name: mirror-crates

on:
  push:
    branches: [beta]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-peacemaker
  cancel-in-progress: false

jobs:
  peacemaker:
    if: github.ref == 'refs/heads/beta'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install history filter
        run: python3 -m pip install git-filter-repo==2.47.0
      - name: Split canonical history
        run: scripts/mirror-split.sh peacemaker "$RUNNER_TEMP/peacemaker"
      - name: Check standalone workspace
        run: cargo check --workspace --manifest-path "$RUNNER_TEMP/peacemaker/Cargo.toml"
      - name: Publish PeaceMaker main branch
        env:
          MIRROR_KEY: ${{ secrets.PEACEMAKER_MIRROR_KEY }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # A queued run must never replace a newer canonical snapshot.
          current=$(git ls-remote https://github.com/warpfront/hipfire.git refs/heads/beta | cut -f1)
          if [ "$current" != "$SOURCE_SHA" ]; then
            echo "Skipping superseded canonical snapshot"
            exit 0
          fi
          test -n "$MIRROR_KEY" || { echo "Mirror deploy key is not configured" >&2; exit 1; }
          umask 077
          mkdir -p "$HOME/.ssh"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$HOME/.ssh/known_hosts"
          key_file="$RUNNER_TEMP/mirror-key"
          printf '%s\n' "$MIRROR_KEY" > "$key_file"
          trap 'rm -f "$key_file"' EXIT
          export GIT_SSH_COMMAND="ssh -i $key_file -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          git -C "$RUNNER_TEMP/peacemaker" push --force \
            git@github.com:warpfront/peacemaker.git HEAD:refs/heads/main
