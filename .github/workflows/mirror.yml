# SPDX-License-Identifier: Apache-2.0
name: mirror-crates

on:
  push:
    branches: [beta]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    if: github.ref == 'refs/heads/beta'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: peacemaker
            branch: main
            key: PEACEMAKER_MIRROR_KEY
          - name: redline
            branch: master
            key: REDLINE_MIRROR_KEY
    concurrency:
      group: mirror-${{ matrix.name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install history filter
        run: python3 -m pip install git-filter-repo==2.47.0
      - name: Split canonical history
        env:
          MIRROR_NAME: ${{ matrix.name }}
        run: scripts/mirror-split.sh "$MIRROR_NAME" "$RUNNER_TEMP/mirror-$MIRROR_NAME"
      - name: Check standalone workspace
        env:
          MIRROR_NAME: ${{ matrix.name }}
        run: cargo check --workspace --manifest-path "$RUNNER_TEMP/mirror-$MIRROR_NAME/Cargo.toml"
      - name: Publish mirror branch
        env:
          MIRROR_NAME: ${{ matrix.name }}
          MIRROR_BRANCH: ${{ matrix.branch }}
          MIRROR_KEY: ${{ secrets[matrix.key] }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # A queued run must never replace a newer canonical snapshot.
          current=$(git ls-remote https://github.com/warpfront/hipfire.git refs/heads/beta | cut -f1)
          if [ "$current" != "$SOURCE_SHA" ]; then
            echo "Skipping superseded canonical snapshot"
            exit 0
          fi
          test -n "$MIRROR_KEY" || { echo "Mirror deploy key is not configured" >&2; exit 1; }
          umask 077
          mkdir -p "$HOME/.ssh"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$HOME/.ssh/known_hosts"
          key_file="$RUNNER_TEMP/mirror-key"
          printf '%s\n' "$MIRROR_KEY" > "$key_file"
          trap 'rm -f "$key_file"' EXIT
          export GIT_SSH_COMMAND="ssh -i $key_file -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          if [ "$MIRROR_NAME" = peacemaker ]; then
            git -C "$RUNNER_TEMP/mirror-$MIRROR_NAME" push --force \
              "git@github.com:warpfront/$MIRROR_NAME.git" "HEAD:refs/heads/$MIRROR_BRANCH"
          else
            # Redline is an overlay: retain master history and reject races.
            git -C "$RUNNER_TEMP/mirror-$MIRROR_NAME" push \
              "git@github.com:warpfront/$MIRROR_NAME.git" "HEAD:refs/heads/$MIRROR_BRANCH"
          fi
