# Gemma 4 31B-it heretic-ara (Gemma 4 with its refusals removed by Heretic's ARA): the same container
# as gemma4-31b-i8g.yaml, built from that checkpoint. The vision tower stays in host memory, so its
# VRAM goes to the KV cache. For the full 262,144-token context use --max-model-len 262144
# --max-num-seqs 2.
name: radiance-gemma4-31b-heretic-ara-i8g
services:
  radiance:
    extends: { file: common.yaml, service: radiance }
    container_name: radiance-gemma4-31b-heretic-ara-i8g
    command: >
      --model /models/gemma4-31b-heretic-ara-i8g.rad
      --host :: --port ${PORT:-8000} --api-key-env RADIANCE_API_KEY
      --tp 2 --max-num-seqs 8 --max-model-len 65536 --kv-cache-dtype fp8
      --num-speculative-tokens 3 --max-num-batched-tokens 2048 --vision-tower-placement ram
      --temp 1.0 --top-p 0.95 --top-k 64
