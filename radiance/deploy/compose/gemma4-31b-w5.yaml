# Gemma 4 31B-it w5: every trunk linear asymmetric int5 (GPTQ from the bf16 checkpoint, a scale and a zero
# point per 128 weights), Google's assistant head as the MTP drafter (depth 3), and the vision tower. The
# vision tower stays in host memory, so its VRAM goes to the KV cache. For the full 262,144-token context
# use --max-model-len 262144 --max-num-seqs 2.
name: radiance-gemma4-31b-w5
services:
  radiance:
    extends: { file: common.yaml, service: radiance }
    container_name: radiance-gemma4-31b-w5
    command: >
      --model /models/gemma4-31b-w5.rad
      --host :: --port ${PORT:-8000} --api-key-env RADIANCE_API_KEY
      --tp 2 --max-num-seqs 8 --max-model-len 65536 --kv-cache-dtype fp8 --vision-tower-placement ram
      --num-speculative-tokens 3 --max-num-batched-tokens 2048 --temp 1.0 --top-p 0.95 --top-k 64
